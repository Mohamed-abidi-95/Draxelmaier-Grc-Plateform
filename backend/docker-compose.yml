version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grc-postgres
    environment:
      POSTGRES_DB: grc_db
      POSTGRES_USER: grc_user
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: grc-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: grc-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password123!
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: grc-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin Password123!;
      /usr/bin/mc mb myminio/grc-documents --ignore-existing;
      /usr/bin/mc anonymous set private myminio/grc-documents;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: grc-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  minio_data:
